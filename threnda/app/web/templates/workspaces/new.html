<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up Threnda</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div style="max-width:520px;margin:80px auto;padding:0 20px">
  <div class="sidebar-brand" style="margin-bottom:24px">
    <span class="mark" aria-hidden="true"></span>
    <span class="name" style="font-size:16px">Threnda</span>
    <span class="edition">community</span>
  </div>
  <div class="first-run-card" style="margin:0">
    <div class="eyebrow">First run</div>
    <h3>Create your first workspace</h3>
    <p>A workspace is the boundary everything else belongs to — sources, imports,
       findings, exposures. Community runs one tenant; you can create more later
       if you need to separate environments.</p>

    {% if error %}
    <div class="error-banner" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/workspaces/new" style="margin-top:18px">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="workspace-name">Workspace name</label>
        <input id="workspace-name" type="text" name="name" required maxlength="200"
               placeholder="e.g. default" autofocus>
      </div>
      <button type="submit" class="btn btn-primary">Create workspace</button>
    </form>
  </div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Threnda</title>
  <link rel="stylesheet" href="/static/css/tokens.css?v=0.1.0.dev1-1">
  <link rel="stylesheet" href="/static/css/app.css?v=0.1.0.dev1-1">
</head>
<body>
<div style="max-width:420px;margin:100px auto;padding:0 20px">
  <div class="sidebar-brand" style="margin-bottom:24px">
    <span class="mark" aria-hidden="true"></span>
    <span class="name" style="font-size:16px">Threnda</span>
    <span class="edition">community</span>
  </div>
  <div class="first-run-card" style="margin:0">
    <h3>Log in</h3>

    {% if error %}
    <div class="error-banner" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" style="margin-top:12px">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" name="username" required maxlength="64"
               autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" name="password" required maxlength="256"
               autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
  </div>
</div>
</body>
</html>

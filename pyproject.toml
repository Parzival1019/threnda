[project]
name = "threnda"
version = "0.1.0"
description = "Private, self-hosted security finding management. Every finding. One queue."
readme = "README.md"
requires-python = ">=3.12"
# License selection is pending before the first public release.
# Do not add a license classifier or a LICENSE file until it is decided.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pypdf>=6.16.1,<7",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Only needed to talk to PostgreSQL (THRENDA_DATABASE_URL=postgresql+psycopg://...).
# SQLite, the default, needs nothing extra — this stays a separate extra so a
# plain local `pip install -e ".[dev]"` doesn't need a C toolchain/libpq.
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
threnda = "threnda.app.cli:main"

[project.urls]
Homepage = "https://github.com/Parzival1019/threnda"
Documentation = "https://github.com/Parzival1019/threnda/tree/main/docs"
Issues = "https://github.com/Parzival1019/threnda/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["threnda"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection intentionally calls Depends()/Query() as
# argument defaults; that's the framework's documented pattern, not the
# mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S107"]
"migrations/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Alembic-generated migration scripts: not hand-authored application code,
# and Alembic's own templates/typing are not strict-mode clean.
module = "migrations.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

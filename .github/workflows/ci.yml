name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev,postgres]" pip-audit bandit build
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Types
        run: mypy threnda tests migrations
      - name: Tests
        run: pytest
      - name: Dependency consistency
        run: pip check
      - name: Dependency audit
        run: pip-audit
      - name: High-severity static security scan
        run: bandit -q -lll -r threnda
      - name: Build distribution
        run: python -m build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag threnda:${{ github.sha }} .
